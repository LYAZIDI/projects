<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LM-WMS — Terminal RF</title>
  <style>
    /* Émulation d'un terminal RF caractère (type LM7 / telnet 5250) */
    body {
      margin: 0; min-height: 100vh;
      background: #10151a;
      display: flex; align-items: center; justify-content: center;
      font-family: Consolas, "Courier New", monospace;
    }
    .pistolet {
      background: #20262d;
      border-radius: 18px;
      padding: 26px 22px 18px;
      box-shadow: 0 18px 50px rgba(0,0,0,.6), inset 0 1px 0 #39424c;
    }
    .ecran {
      background: #041504;
      border: 3px solid #0a2a0a;
      border-radius: 6px;
      padding: 12px 14px;
      width: 420px; height: 330px;
      color: #33ee55;
      font-size: 15px; line-height: 1.35;
      text-shadow: 0 0 6px rgba(51, 238, 85, .45);
      overflow: hidden;
      display: flex; flex-direction: column;
    }
    .ecran pre { margin: 0; flex: 1; white-space: pre-wrap; font-family: inherit; }
    .inverse { background: #33ee55; color: #041504; text-shadow: none; }
    .ligne-saisie { display: flex; gap: 6px; align-items: center; }
    .ligne-saisie input {
      flex: 1; background: transparent; border: none; outline: none;
      color: #33ee55; font: inherit; text-shadow: inherit;
      caret-color: #33ee55; text-transform: uppercase;
    }
    .fonctions {
      margin-top: 12px; display: flex; gap: 8px; justify-content: center; flex-wrap: wrap;
    }
    .fonctions button {
      background: #39424c; color: #cfd8e0; border: 1px solid #1a2026;
      border-bottom-width: 3px; border-radius: 6px;
      font: 600 12px/1.1 "Segoe UI", sans-serif;
      padding: 8px 12px; cursor: pointer; min-width: 62px;
    }
    .fonctions button:active { border-bottom-width: 1px; transform: translateY(2px); }
    .langues button { min-width: 42px; padding: 5px 10px; }
    .langues button.actif { background: #33ee55; color: #041504; border-color: #33ee55; }
    .marque { text-align: center; color: #7c8894; font: 600 11px "Segoe UI", sans-serif; margin-top: 10px; letter-spacing: 2px; }
  </style>
</head>
<body>
  <div class="pistolet">
    <div class="ecran">
      <pre id="affichage"></pre>
      <div class="ligne-saisie"><span id="invite">&gt;</span>
        <input id="saisie" autocomplete="off" autofocus></div>
    </div>
    <div class="fonctions">
      <button data-touche="ENTREE">ENT</button>
      <button data-touche="ESC">ESC<br><span data-i18n>Retour</span></button>
      <button data-touche="F1">F1<br>Menu</button>
      <button data-touche="F4">F4<br><span data-i18n>Écart</span></button>
    </div>
    <div class="fonctions langues">
      <button data-langue="fr" title="Français">FR</button>
      <button data-langue="en" title="English">EN</button>
      <button data-langue="es" title="Español">ES</button>
      <button data-langue="ar" title="العربية">AR</button>
    </div>
    <div class="marque">LM-WMS &nbsp;·&nbsp; TERMINAL RF</div>
  </div>
  <script src="i18n.js"></script>
  <script src="rf.js"></script>
</body>
</html>
